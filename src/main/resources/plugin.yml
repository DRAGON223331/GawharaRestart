name: GawharaRestart
version: 1.0.0
main: com.gawhara.restart.GawharaRestart
api-version: '1.20'
description: Scheduled automatic restart with Arabic countdown announcements
commands:
  grestart:
    description: Manage automatic server restarts
    usage: /grestart [status|add|remove|in|cancel|reload]
    aliases: [autorestart]
permissions:
  gawhararestart.admin:
    description: Manage scheduled restarts
    default: op

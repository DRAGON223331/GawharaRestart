# المنطقة الزمنية (القاهرة)
timezone: "Africa/Cairo"

# مواعيد الريستارت الافتراضية (أول مرة بس) - بعد كده بتتحفظ في schedule.yml
# تقدر تضيف/تشيل بالأمر /grestart add 04:00
default-times:
  - "04:00"

# التنبيهات قبل الريستارت (بالثواني)
warnings: [1800, 900, 600, 300, 180, 120, 60, 30, 10, 5, 4, 3, 2, 1]

# يظهر Title على الشاشة لما الوقت المتبقي <= الرقم ده (ثواني)
title-from-seconds: 60
# يظهر Actionbar كل ثانية لما الوقت المتبقي <= الرقم ده (ثواني)
actionbar-seconds: 60

# الأمر اللي بينفذ في الكونسول لإيقاف السيرفر (الاستضافة هتشغله تاني لو Auto Restart شغال)
restart-command: "stop"

messages:
  prefix: "&6&l[ريستارت] &r"
  warning: "&eالسيرفر هيعمل ريستارت بعد &c{time}&e. احفظوا حاجتكم ومتنسوش تخرجوا بأمان!"
  title: "&c⚠ ريستارت السيرفر"
  subtitle: "&eبعد {time}"
  actionbar: "&c⏳ الريستارت بعد {time}"
  restarting-now: "&cالسيرفر بيعمل ريستارت دلوقتي... نشوفكم بعد دقيقة!"
  kick: "&cالسيرفر بيعمل ريستارت دلوقتي\n&eارجعوا بعد دقيقة ✔"
